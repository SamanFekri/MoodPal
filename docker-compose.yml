services:
  bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME}
      - MONGODB_URI=${MONGODB_URI}
      - OLAF_CHANNEL_ID=${OLAF_CHANNEL_ID}
      - MAIN_CHANNEL_ID=${MAIN_CHANNEL_ID}
      - MAIN_CHANNEL_USERNAME=${MAIN_CHANNEL_USERNAME}
      - CRON_JOB_TIME=${CRON_JOB_TIME}
      - SERVER_HOST=${SERVER_HOST}
      - SERVER_PORT=${SERVER_PORT}
      - SERVER_BASE_URL=${SERVER_BASE_URL:-https://moodpal.samanfekri.me}
      - WEEKLY_CRON_JOB_TIME=${WEEKLY_CRON_JOB_TIME}
      - KEY_ENCRYPTION_SECRET=${KEY_ENCRYPTION_SECRET}
    ports:
      - "8080:${SERVER_PORT}"
    restart: unless-stopped
    # GET /healthz answers 503 when the bot can't reach Telegram or isn't receiving messages
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.SERVER_PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 60s
      timeout: 20s
      start_period: 60s
      retries: 3
    networks:
      - shared-network

networks:
  shared-network:
    external: true